accessLog:
  format: json
certificatesResolvers:
  letsencrypt:
    acme:
      storage: /data/acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - 1.1.1.1:53
          - 1.0.0.1:53
log:
  format: json
  level: INFO
providers:
  file:
    filename: /etc/bento-proxy/routes.yaml
    watch: true
