http:
  routers:
    ai:
      rule: Host(`ai.excloo.com`)
      service: ai
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui:
      rule: Host(`comfy.excloo.com`)
      service: comfyui
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui-video:
      rule: Host(`comfy-video.excloo.com`)
      service: comfyui-video
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui-video-x:
      rule: Host(`comfy-video-x.excloo.com`)
      service: comfyui-video-x
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui-x:
      rule: Host(`comfy-x.excloo.com`)
      service: comfyui-x
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    files:
      rule: Host(`ai-files.excloo.com`)
      service: files
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    heiss:
      rule: Host(`studio.excloo.com`)
      service: heiss
      entryPoints:
        - lan
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    heiss-x:
      rule: Host(`studio-x.excloo.com`)
      service: heiss-x
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    radiance:
      rule: Host(`radiance.excloo.com`)
      service: radiance
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
  services:
    ai:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1337
    comfyui:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8190
    comfyui-video:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8191
    comfyui-video-x:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8189
    comfyui-x:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8188
    files:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8090
    heiss:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8788
    heiss-x:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8787
    radiance:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1337
