http:
  routers:
    ai:
      rule: Host(`ai.excloo.com`)
      service: ai
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui:
      rule: Host(`comfy.excloo.com`)
      service: comfyui
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    comfyui-video:
      rule: Host(`comfy-video.excloo.com`)
      service: comfyui-video
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    files:
      rule: Host(`ai.excloo.com`) && (Path(`/files`) || PathPrefix(`/files/`))
      service: files
      entryPoints:
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
    heiss:
      rule: Host(`studio.excloo.com`)
      service: heiss
      entryPoints:
        - lan
        - tailnet
        - tailnet-v6
      tls:
        certResolver: letsencrypt
  services:
    ai:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1337
    comfyui:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8190
    comfyui-video:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8191
    files:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8090
    heiss:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:8788
