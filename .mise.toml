[tools]
1password-cli = "2.38.1"
actionlint = "1.7.12"
"aqua:coreos/butane" = "0.29.0"
jq = "1.8.2"
kubectl = "1.36.4"
opentofu = "1.12.6"
prek = "0.5.2"
prettier = "3.9.6"
shellcheck = "0.11.0"
talosctl = "1.13.9"
yq = "4.53.6"

[env]
_OP_CONNECT_HOST = "op://Homelab/OpenTofu/op_connect_host"
_OP_CONNECT_TOKEN = "op://Homelab/OpenTofu/op_connect_token"
B2_APPLICATION_KEY = "op://Homelab/OpenTofu/b2_application_key"
B2_APPLICATION_KEY_ID = "op://Homelab/OpenTofu/b2_application_key_id"
CLOUDFLARE_API_KEY = "op://Homelab/OpenTofu/cloudflare_api_key"
CLOUDFLARE_EMAIL = "op://Homelab/OpenTofu/cloudflare_email"
GOOGLE_CREDENTIALS = "op://Homelab/OpenTofu/google_credentials"
OCI_FINGERPRINT = "op://Homelab/OpenTofu/oci_fingerprint"
OCI_USER_OCID = "op://Homelab/OpenTofu/oci_user_ocid"
RESEND_API_KEY = "op://Homelab/OpenTofu/resend_api_key"
TAILSCALE_OAUTH_CLIENT_ID = "op://Homelab/OpenTofu/tailscale_oauth_client_id"
TAILSCALE_OAUTH_CLIENT_SECRET = "op://Homelab/OpenTofu/tailscale_oauth_client_secret"
TAILSCALE_TAILNET = "op://Homelab/OpenTofu/tailscale_tailnet"
TF_VAR_oci_private_key_base64 = "op://Homelab/OpenTofu/oci_private_key_base64"
TF_VAR_oci_tenancy_ocid = "op://Homelab/OpenTofu/oci_tenancy_ocid"
TRUENAS_API_KEY = "op://Homelab/OpenTofu/truenas_api_key"
TRUENAS_URL = "op://Homelab/OpenTofu/truenas_url"
UNIFI_API = "op://Homelab/OpenTofu/unifi_api"
UNIFI_API_KEY = "op://Homelab/OpenTofu/unifi_api_key"

# Deploy
[tasks.apply]
description = "Apply all changes"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- sh -c 'export OP_CONNECT_HOST=\"$_OP_CONNECT_HOST\" OP_CONNECT_TOKEN=\"$_OP_CONNECT_TOKEN\"; exec tofu apply'"

[tasks.plan]
description = "Plan all changes"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- sh -c 'export OP_CONNECT_HOST=\"$_OP_CONNECT_HOST\" OP_CONNECT_TOKEN=\"$_OP_CONNECT_TOKEN\"; exec tofu plan'"

# Development
[tasks.check]
description = "Check formatting and infrastructure configuration"
run = """
actionlint .github/workflows/*.yaml
for file in hosts/*/*.bu; do butane --files-dir hosts --strict "${file}" >/dev/null; done
prettier --check .
shellcheck hosts/*/etc/NetworkManager/dispatcher.d/* scripts/*.sh
tofu fmt -check -recursive
tofu validate
"""

[tasks.fmt]
description = "Format project files"
run = """
prettier --write .
tofu fmt -recursive
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"

# Scripts
[tasks.client-configs]
description = "Sync workstation kubeconfig and talosconfig from 1Password"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN scripts/sync_client_configs.sh"

[tasks.ignition]
description = "Render complete uCore Ignition configurations"
run = "scripts/render_ignition.sh"

[tasks.prepare-oci-image]
description = "Download and convert the Talos Oracle image archive"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- scripts/prepare_oci_image.sh"

[tasks.ssh-config]
description = "Install the non-secret homelab SSH include"
run = "scripts/render_ssh_config.sh ${HOME}/.ssh/config.d/homelab"

# Setup
[tasks.init]
description = "Initialise providers and the remote backend"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- sh -c 'export OP_CONNECT_HOST=\"$_OP_CONNECT_HOST\" OP_CONNECT_TOKEN=\"$_OP_CONNECT_TOKEN\"; exec tofu init -input=false'"

[tasks.init-ci]
description = "Initialise providers without the remote backend"
run = "env -u GOOGLE_CREDENTIALS tofu init -backend=false -input=false"

[tasks.opentofu-item]
description = "Create the OpenTofu 1Password item if missing"
run = "scripts/setup_opentofu_item.sh"

[tasks.setup]
description = "Install tools, create the 1Password item, initialise providers, and install Git hooks"
run = """
mise install
mise run opentofu-item
mise run init
prek install
"""
