[tools]
actionlint = "1.7.12"
opentofu = "1.12"
prek = "0.4.13"
prettier = "3.9.6"
talosctl = "1.13"
tflint = "0.59.1"
trivy = "0.73.0"

# Setup
[tasks.setup]
description = "Install tools, initialise providers, and install Git hooks"
run = """
mise install
tofu init -backend=false -input=false
prek install
"""

# Development
[tasks.check]
description = "Check formatting and infrastructure configuration"
run = """
prettier --check .
actionlint .github/workflows/*.yaml
tofu fmt -check -recursive
tofu validate
tflint
trivy config --exit-code 1 --severity HIGH,CRITICAL .
"""

[tasks.fmt]
description = "Format project files"
run = """
prettier --write .
tofu fmt -recursive
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"
