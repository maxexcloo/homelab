[tools]
"aqua:coreos/butane" = "latest"
# Match the configured Kubernetes cluster version.
kubectl = "1.37.1"
# Match the configured Talos cluster version.
talosctl = "1.14.5"

[env]
TF_DATA_DIR = "{{env.HOME}}/.cache/opentofu/homelab"

# Deploy
[tasks.apply]
run = "scripts/opentofu.sh apply"

[tasks.plan]
run = "scripts/opentofu.sh plan"

# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:shell",
  "check:updates",
  "check:whitespace",
  "hooks:check",
]

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt"]
run = "tofu fmt -recursive"

# Scripts
[tasks."clients:sync"]
description = "Sync Workstation Kubeconfig & Talosconfig From 1Password"
run = "scripts/sync_client_configs.sh"

[tasks."hosts:ignition"]
description = "Render Host Installation Files"
run = '''
output_directory="${IGNITION_OUTPUT_DIRECTORY:-${XDG_CACHE_HOME:-${HOME}/.cache}/homelab/ignition}"
mkdir -p "${output_directory}"
for config in hosts/*/*.bu; do
  butane --files-dir hosts --output "${output_directory}/$(basename "${config}" .bu).ign" --pretty --strict "${config}"
done
'''

[tasks."hosts:sync"]
description = "Sync Host Files & Restart Changed Units"
run = "scripts/sync_hosts.sh"

[tasks."oci:image:prepare"]
run = "fnox exec -- scripts/prepare_oci_image.sh"

[tasks."ssh:configure"]
run = 'scripts/render_ssh_config.sh "${HOME}/.ssh/config.d/homelab"'

# Setup
[tasks.init]
run = "scripts/opentofu.sh init -input=false"

[tasks."init:check"]
description = "Initialise Providers Without Remote Backend"
run = "tofu init -backend=false -input=false -lockfile=readonly"

[tasks."opentofu:item"]
description = "Create Missing OpenTofu 1Password Item"
run = "scripts/setup_opentofu_item.sh"

[tasks.setup]
run = [{ task = "opentofu:item" }, { task = "init" }]
