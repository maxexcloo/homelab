[env]
API_DATA_IS_SENSITIVE = "true"
PYTHONDONTWRITEBYTECODE = "1"

[tools]
actionlint = "1.7.12"
gcloud = "579.0.0"
opentofu = "1.12.5"
prek = "0.4.13"
prettier = "3.9.6"
ruff = "0.16.2"
uv = "0.12.3"

# Setup
[tasks.init]
description = "Initialise OpenTofu"
run = "tofu init"

[tasks.setup]
description = "Clean local data, configure, initialise, and install Git hooks"
depends = ["cleanup"]
run = """
if [[ ! -f .mise.local.toml ]]; then
  cp .mise.local.toml.default .mise.local.toml
  echo "Created .mise.local.toml - please add your tokens"
  exit 1
fi
tofu init
prek install
"""

# Development
[tasks.check]
description = "Format check, lint, and validate"
depends = ["lint", "test", "validate"]
run = """
actionlint .github/workflows/*.yaml
prettier --check .
ruff format --check .
"""

[tasks.cleanup]
description = "Remove local OpenTofu data, the Ruff cache, and the saved plan"
run = """
find . -path ./.git -prune -o \
  -type d \\( -name .ruff_cache -o -name .terraform \\) \
  -prune -exec rm -rf -- {} +
find . -path ./.git -prune -o \
  -type f -name tfplan \
  -exec rm -f -- {} +
"""

[tasks.fmt]
description = "Format all files"
run = """
prettier --write .
ruff check --fix --select I .
ruff format .
tofu fmt -recursive
"""

[tasks.lint]
description = "Lint source and validate data"
depends = ["sort-check"]
run = """
ruff check --extend-select I .
uv run scripts/validate_data.py
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"

[tasks.sort-check]
description = "Check HCL assignment grouping, JSON Schema, and YAML key ordering"
run = "uv run scripts/sort_check.py"

[tasks.test]
description = "Run unit tests"
run = "uv run --with httpx==0.28.1 --with onepasswordconnectsdk==2.1.0 --with pytest==9.0.2 pytest -p no:cacheprovider"

[tasks.validate]
description = "Check and validate OpenTofu configuration"
run = """
tofu fmt -check -recursive
tofu validate
"""

# Plan
[tasks.plan]
description = "Plan all changes"
run = "tofu plan"

# Deploy
[tasks.apply]
description = "Apply all changes"
run = 'tofu apply'
