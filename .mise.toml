[tools]
"aqua:coreos/butane" = "latest"
kubectl = "{{ exec(command=\"awk '/^kubernetes:/ { print substr($2, 2); found = 1 } END { exit !found }' data/versions.yaml\") }}"
talosctl = "{{ exec(command=\"awk '/^talos:/ { print substr($2, 2); found = 1 } END { exit !found }' data/versions.yaml\") }}"

[env]
TF_DATA_DIR = "{{ get_env(name='XDG_CACHE_HOME', default=env.HOME ~ '/.cache') }}/opentofu/homelab"

# Deploy
[tasks.apply]
run = "fnox exec -- tofu apply"

[tasks.plan]
run = "fnox exec -- tofu plan"

# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:shell",
  "check:updates",
  "check:whitespace",
  "hooks:check",
]

# Kubelab's Homepage downloads this repository's data at runtime.
[tasks."check:kubelab"]
description = "Render Kubelab Main Homepage Services From This Checkout"
run = '''
set -eu
kubelab_directory=$(mktemp -d)
trap 'rm -fr -- "$kubelab_directory"' EXIT
curl -fsSL https://codeload.github.com/maxexcloo/kubelab/tar.gz/refs/heads/main | tar -xz -C "$kubelab_directory" --strip-components=1
cd "$kubelab_directory"
mkdir -p output
HOMELAB_INFRASTRUCTURE_FILE=tests/fixtures/homepage/infrastructure.json \
  HOMEPAGE_BESZEL_ROUTES=tests/fixtures/homepage/beszel-routes.json \
  sh apps/base/homepage/render_services.sh output/services.yaml "$MISE_PROJECT_ROOT"
'''

[tasks.fmt]
run = "tofu fmt -recursive"
depends = ["fmt:mise", "fmt:oxfmt"]

# Scripts
[tasks."clusters:image"]
run = "scripts/prepare_oci_image.sh"

[tasks."clusters:sync"]
description = "Sync Workstation Kubeconfig & Talosconfig From 1Password"
run = "scripts/sync_client_configs.sh"

[tasks."hosts:ignition"]
description = "Render Host Installation Files"
run = '''
set -eu
output_directory="${IGNITION_OUTPUT_DIRECTORY:-${XDG_CACHE_HOME:-${HOME}/.cache}/homelab/ignition}"
scripts/render_hosts.sh "${output_directory}" "$@"
'''

[tasks."hosts:ssh"]
run = 'scripts/render_ssh_config.sh "${HOME}/.ssh/config.d/homelab"'

[tasks."hosts:sync"]
description = "Sync Generated Host Files"
run = "scripts/sync_hosts.sh"

# Setup
[tasks.init]
run = "fnox exec -- tofu init -input=false"

[tasks."init:offline"]
description = "Initialise Providers Without Remote Backend"
run = "tofu init -backend=false -input=false -lockfile=readonly"

[tasks.setup]
run = [{ task = "setup:credentials" }, { task = "init" }]

[tasks."setup:credentials"]
description = "Create Missing OpenTofu 1Password Fields"
run = "scripts/setup_opentofu_item.sh"
