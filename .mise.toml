[tools]
1password-cli = "2.38.1"
actionlint = "1.7.12"
jq = "1.8.2"
kubectl = "1.36.4"
opentofu = "1.12.6"
prek = "0.4.14"
prettier = "3.9.6"
shellcheck = "0.11.0"
talosctl = "1.13.9"
yq = "4.53.6"

[env]
_OP_CONNECT_HOST = "op://Homelab/OpenTofu/OP_CONNECT_HOST"
_OP_CONNECT_TOKEN = "op://Homelab/OpenTofu/OP_CONNECT_TOKEN"
CLOUDFLARE_API_KEY = "op://Homelab/OpenTofu/CLOUDFLARE_API_KEY"
CLOUDFLARE_EMAIL = "op://Homelab/OpenTofu/CLOUDFLARE_EMAIL"
GOOGLE_CREDENTIALS = "op://Homelab/OpenTofu/GOOGLE_CREDENTIALS"
OCI_FINGERPRINT = "op://Homelab/OpenTofu/OCI_FINGERPRINT"
OCI_REGION = "op://Homelab/OpenTofu/OCI_REGION"
OCI_USER_OCID = "op://Homelab/OpenTofu/OCI_USER_OCID"
TAILSCALE_OAUTH_CLIENT_ID = "op://Homelab/OpenTofu/TAILSCALE_OAUTH_CLIENT_ID"
TAILSCALE_OAUTH_CLIENT_SECRET = "op://Homelab/OpenTofu/TAILSCALE_OAUTH_CLIENT_SECRET"
TAILSCALE_TAILNET = "op://Homelab/OpenTofu/TAILSCALE_TAILNET"
TF_VAR_oci_private_key_base64 = "op://Homelab/OpenTofu/OCI_PRIVATE_KEY_BASE64"
TF_VAR_oci_tenancy_ocid = "op://Homelab/OpenTofu/OCI_TENANCY_OCID"
TRUENAS_API_KEY = "op://Homelab/OpenTofu/TRUENAS_API_KEY"
TRUENAS_URL = "op://Homelab/OpenTofu/TRUENAS_URL"
UNIFI_API = "op://Homelab/OpenTofu/UNIFI_API"
UNIFI_API_KEY = "op://Homelab/OpenTofu/UNIFI_API_KEY"

# Deploy
[tasks.apply]
description = "Apply all changes"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- sh -c 'export OP_CONNECT_HOST=\"$_OP_CONNECT_HOST\" OP_CONNECT_TOKEN=\"$_OP_CONNECT_TOKEN\"; exec tofu apply'"

[tasks.plan]
description = "Plan all changes"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- sh -c 'export OP_CONNECT_HOST=\"$_OP_CONNECT_HOST\" OP_CONNECT_TOKEN=\"$_OP_CONNECT_TOKEN\"; exec tofu plan'"

# Development
[tasks.check]
description = "Check formatting and infrastructure configuration"
run = """
actionlint .github/workflows/*.yaml
prettier --check .
shellcheck scripts/*.sh
yq -p=toml -o=json -r '.tasks.opentofu-item.run' .mise.toml | shellcheck -s sh -
tofu fmt -check -recursive
tofu validate
"""

[tasks.fmt]
description = "Format project files"
run = """
prettier --write .
tofu fmt -recursive
"""

[tasks.prek]
description = "Run all repository hooks"
run = "prek run --all-files"

# Scripts
[tasks.client-configs]
description = "Sync workstation kubeconfig and talosconfig from 1Password"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN scripts/sync_client_configs.sh"

[tasks.prepare-oci-image]
description = "Download and convert the Talos Oracle image archive"
run = "env -u OP_CONNECT_HOST -u OP_CONNECT_TOKEN op run -- scripts/prepare_oci_image.sh"

[tasks.ssh-config]
description = "Install the non-secret homelab SSH include"
run = "scripts/render_ssh_config.sh ${HOME}/.ssh/config.d/homelab"

# Setup
[tasks.init]
description = "Initialise providers without connecting the backend"
run = "env -u GOOGLE_CREDENTIALS tofu init -backend=false -input=false"

[tasks.opentofu-item]
description = "Create the OpenTofu 1Password item if missing"
run = '''
set -eu

unset OP_CONNECT_HOST OP_CONNECT_TOKEN

for tool in jq op yq; do
  if ! command -v "${tool}" >/dev/null 2>&1; then
    echo "error: ${tool} is required but not found in PATH." >&2
    exit 1
  fi
done

required_fields_json="$(
  yq -p=toml -o=json '
    [.env[]
      | select(test("^op://Homelab/OpenTofu/"))
      | sub("^op://Homelab/OpenTofu/"; "")]
    | unique
    | sort
  ' .mise.toml
)"

if [ "$(printf '%s\n' "${required_fields_json}" | jq 'length')" -eq 0 ]; then
  echo "error: no Homelab/OpenTofu references found in .mise.toml." >&2
  exit 1
fi

vaults_json="$(op vault list --format json)"
vault_count="$(
  printf '%s\n' "${vaults_json}" |
    jq '[.[] | select(.name == "Homelab")] | length'
)"
vault_id="$(
  printf '%s\n' "${vaults_json}" |
    jq -r '[.[] | select(.name == "Homelab")][0].id // ""'
)"

if [ "${vault_count}" -ne 1 ]; then
  echo "error: expected exactly one accessible Homelab vault; found ${vault_count}." >&2
  exit 1
fi

items_json="$(op item list --vault "${vault_id}" --format json)"
item_count="$(
  printf '%s\n' "${items_json}" |
    jq '[.[] | select(.title == "OpenTofu")] | length'
)"
item_id="$(
  printf '%s\n' "${items_json}" |
    jq -r '[.[] | select(.title == "OpenTofu")][0].id // ""'
)"

if [ "${item_count}" -gt 1 ]; then
  echo "error: found multiple OpenTofu items in the Homelab vault." >&2
  exit 1
fi

if [ "${item_count}" -eq 1 ]; then
  item_json="$(op item get "${item_id}" --vault "${vault_id}" --format json)"
  missing_fields="$(
    printf '%s\n' "${item_json}" |
      jq -r --argjson required "${required_fields_json}" '
        $required - ([.fields[] | select(.id != "notesPlain") | .label] | unique)
        | .[]
      '
  )"

  if [ -n "${missing_fields}" ]; then
    echo "error: the Homelab/OpenTofu item is missing these fields:" >&2
    printf '%s\n' "${missing_fields}" | while IFS= read -r field; do
      echo "  - ${field}" >&2
    done
    exit 1
  fi

  echo "The Homelab/OpenTofu item already exists."
  exit 0
fi

set -- "notesPlain=Provider environment for the homelab OpenTofu root."
while IFS= read -r field; do
  set -- "$@" "${field}[password]="
done <<EOF
$(printf '%s\n' "${required_fields_json}" | jq -r '.[]')
EOF

op item create \
  --category "API Credential" \
  --title "OpenTofu" \
  --vault "${vault_id}" \
  "$@" \
  >/dev/null

echo "Created Homelab/OpenTofu. Populate every concealed field before planning or applying."
'''

[tasks.setup]
description = "Install tools, create the 1Password item, initialise providers, and install Git hooks"
run = """
mise install
mise run opentofu-item
mise run init
prek install
"""
