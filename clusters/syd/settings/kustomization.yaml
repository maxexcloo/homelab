      apiVersion: kustomize.toolkit.fluxcd.io/v1
      kind: Kustomization
      metadata:
        name: _
      spec:
        postBuild:
          substitute:
            control_d_profile: 653224sydwhf
            pod_subnet: 10.100.0.0/22
            tailscale_ingress_target: 10.100.5.189
    target:
      group: kustomize.toolkit.fluxcd.io
      kind: Kustomization
      name: (apps|automation|platform)
