name: TrueNAS

on:
  push:
    paths:
      - .github/deploy-request.json
  workflow_dispatch:
    inputs:
      target:
        description: Deploy all, a server, a service, or server/service
        required: false
        type: string

concurrency:
  cancel-in-progress: false
  group: deploy

permissions:
  contents: read

jobs:
  prepare:
    name: Check & Select
    runs-on: ubuntu-latest
    outputs:
      deployments: ${{ steps.select.outputs.deployments }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Run checks
        run: mise run check
      - name: Select deployments
        id: select
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
        run: uv run --no-project .github/scripts/select-deployments.py

  run:
    name: Deploy ${{ matrix.deployment.server }}
    needs: prepare
    if: needs.prepare.outputs.deployments != '[]'
    runs-on: [self-hosted, truenas-cd, "${{ matrix.deployment.server }}"]
    strategy:
      fail-fast: false
      max-parallel: 1

      matrix:
        deployment: ${{ fromJSON(needs.prepare.outputs.deployments) }}
    env:
      BEFORE: ${{ github.event.before }}
      DEPLOYMENT: ${{ toJSON(matrix.deployment) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.1
      - name: Setup TrueNAS client
        run: uv tool install --python 3.12 git+https://github.com/truenas/api_client.git@TS-25.10.5
      - name: Deploy
        run: uv run --no-project .github/scripts/truenas.py
