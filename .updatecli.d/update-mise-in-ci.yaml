# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Mise In CI
pipelineid: update-mise-in-ci
labels:
  group: tools
sources:
  version:
    kind: githubrelease
    spec:
      owner: jdx
      repository: mise
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  workflows:
    kind: file
    sourceid: version
    spec:
      matchpattern: '(?m)([ \t]+version: )[0-9]+\.[0-9]+\.[0-9]+'
      replacepattern: ${1}{{ source "version" }}
      files:
        - .github/workflows/validate.yaml
