# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update cloudflare/cloudflare Provider
pipelineid: update-cloudflare-cloudflare-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: cloudflare
      hostname: registry.opentofu.org
      namespace: cloudflare
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"cloudflare/cloudflare"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
