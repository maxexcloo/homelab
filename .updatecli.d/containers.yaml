# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update docker.io/cloudflare/cloudflared Quadlet
pipelineid: update-docker-io-cloudflare-cloudflared-quadlet
labels:
  group: containers
sources:
  version:
    kind: dockerimage
    spec:
      image: docker.io/cloudflare/cloudflared
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: file
    sourceid: version
    spec:
      file: hosts/hotdog/etc/containers/systemd/cloudflared.container
      matchpattern: (?m)^(Image=docker\.io/cloudflare/cloudflared:)[^\n]+$
      replacepattern: ${1}{{ source "version" }}
---
name: Update docker.io/library/traefik TrueNAS Ingress
pipelineid: update-docker-io-library-traefik-truenas-ingress
labels:
  group: containers
sources:
  version:
    kind: dockerimage
    spec:
      image: docker.io/library/traefik
      tagfilter: ^v[0-9]+\.[0-9]+\.[0-9]+$
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  image:
    kind: file
    sourceid: version
    spec:
      file: data/machines.yaml
      matchpattern: '(?m)^(\s+image: traefik:)[^\n]+$'
      replacepattern: ${1}{{ source "version" }}
---
name: Update docker.io/tailscale/tailscale Talos Container
pipelineid: update-docker-io-tailscale-tailscale-talos-container
labels:
  group: containers
sources:
  version:
    kind: dockerimage
    spec:
      image: docker.io/tailscale/tailscale
      tagfilter: ^v[0-9]+\.[0-9]+\.[0-9]+$
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  image:
    kind: file
    sourceid: version
    spec:
      file: truenas.tf
      matchpattern: '(?m)^(\s+image\s+= "tailscale/tailscale:)[^"]+(")$'
      replacepattern: ${1}{{ source "version" }}${2}
---
name: Update ghcr.io/acmesh-official/acme.sh Quadlet
pipelineid: update-ghcr-io-acmesh-official-acme-sh-quadlet
labels:
  group: containers
sources:
  version:
    kind: dockerimage
    spec:
      image: ghcr.io/acmesh-official/acme.sh
      tagfilter: ^v?[0-9]+(?:\.[0-9]+){0,2}$
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^(v?[0-9]+(?:\.[0-9]+){0,2})$
targets:
  image:
    kind: file
    sourceid: version
    spec:
      file: hosts/common/etc/containers/systemd/cockpit-letsencrypt.container
      matchpattern: (?m)^(Image=ghcr\.io/acmesh\-official/acme\.sh:)[^\n]+$
      replacepattern: ${1}{{ source "version" }}
