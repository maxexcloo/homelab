# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update tailscale/tailscale Provider
pipelineid: update-tailscale-tailscale-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: tailscale
      hostname: registry.opentofu.org
      namespace: tailscale
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"tailscale/tailscale"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
