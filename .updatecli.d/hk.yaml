# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Hk
pipelineid: update-hk
labels:
  group: hk
sources:
  version:
    kind: githubrelease
    spec:
      owner: jdx
      repository: hk
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: hk.pkl
      matchpattern: (download/v)[0-9.]+(/hk@)[0-9.]+
      replacepattern: ${1}{{ source "version" }}${2}{{ source "version" }}
