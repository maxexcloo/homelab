# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update PjSalty/truenas Provider
pipelineid: update-pjsalty-truenas-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: truenas
      hostname: registry.opentofu.org
      namespace: PjSalty
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"PjSalty/truenas"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
