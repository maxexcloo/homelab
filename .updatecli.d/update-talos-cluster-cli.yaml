# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Talos Cluster & CLI
pipelineid: update-talos-cluster-cli
labels:
  group: platform
sources:
  cli:
    kind: githubrelease
    spec:
      owner: siderolabs
      repository: talos
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
  version:
    kind: githubrelease
    spec:
      owner: siderolabs
      repository: talos
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  cli:
    kind: file
    sourceid: cli
    spec:
      file: .mise.toml
      matchpattern: (?m)^(talosctl = ")[^"]+("$)
      replacepattern: ${1}{{ source "cli" }}${2}
  clusters:
    kind: file
    sourceid: version
    spec:
      file: data/clusters.yaml
      matchpattern: "(?m)(talos_version: )v?[0-9.]+"
      replacepattern: ${1}{{ source "version" }}
