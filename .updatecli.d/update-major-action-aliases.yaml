# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Major Action Aliases
pipelineid: update-major-action-aliases
autodiscovery:
  crawlers:
    github/action:
      digest: false
      credentials:
        github.com:
          token: '{{ env "GITHUB_TOKEN" }}'
          kind: github
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
      rootdir: .github
labels:
  group: actions
