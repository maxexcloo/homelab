# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Kubernetes Cluster & CLI
pipelineid: update-kubernetes-cluster-cli
labels:
  group: platform
sources:
  version:
    kind: githubrelease
    spec:
      owner: kubernetes
      repository: kubernetes
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  cli:
    kind: file
    sourceid: version
    spec:
      file: .mise.toml
      matchpattern: (?m)^(kubectl = ")[^"]+("$)
      replacepattern: ${1}{{ source "version" }}${2}
  clusters:
    kind: file
    sourceid: version
    spec:
      file: data/clusters.yaml
      matchpattern: "(?m)(kubernetes_version: )v?[0-9.]+"
      replacepattern: ${1}v{{ source "version" }}
---
