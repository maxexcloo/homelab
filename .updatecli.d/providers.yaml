# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update 1Password/onepassword Provider
pipelineid: update-1password-onepassword-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      hostname: registry.opentofu.org
      name: onepassword
      namespace: 1Password
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"1Password/onepassword"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
