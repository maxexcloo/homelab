# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ubiquiti-community/unifi Provider
pipelineid: update-ubiquiti-community-unifi-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: unifi
      hostname: registry.opentofu.org
      namespace: ubiquiti-community
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"ubiquiti\-community/unifi"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
