# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update isometry/deepmerge Provider
pipelineid: update-isometry-deepmerge-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: deepmerge
      hostname: registry.opentofu.org
      namespace: isometry
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"isometry/deepmerge"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
