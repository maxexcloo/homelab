# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Actions
pipelineid: update-actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      rootdir: .github
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
labels:
  group: actions
