# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Thermalright TRCC
pipelineid: update-thermalright-trcc
labels:
  group: platform
sources:
  package:
    kind: githubrelease
    spec:
      owner: Lexonight1
      repository: thermalright-trcc-linux
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
  version:
    kind: githubrelease
    spec:
      owner: Lexonight1
      repository: thermalright-trcc-linux
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: hosts/bento/bento.bu
      matchpattern: (https://github.com/Lexonight1/thermalright-trcc-linux/releases/download/)v[0-9.]+/trcc-linux-[0-9.]+-
      replacepattern: ${1}{{ source "version" }}/trcc-linux-{{ source "package" }}-
