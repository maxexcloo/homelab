# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update y0n0zawa/resend Provider
pipelineid: update-y0n0zawa-resend-provider
labels:
  group: providers
sources:
  version:
    kind: terraform/registry
    spec:
      name: resend
      hostname: registry.opentofu.org
      namespace: y0n0zawa
      type: provider
      versionfilter:
        kind: semver
        pattern: "*"
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: requirements.tf
      matchpattern: (source\s*=\s*"y0n0zawa/resend"\s+version\s*=\s*")[^"]+(")
      replacepattern: ${1}{{ source "version" }}${2}
