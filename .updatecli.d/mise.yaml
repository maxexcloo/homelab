# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Mise
pipelineid: update-mise
labels:
  group: mise
targets:
  tools:
    disablesourceinput: true
    kind: shell
    spec:
      command: |
        # Platform policies own cluster-compatible clients.
        updates=$(mise outdated --bump --json --local) || exit "$?"
        updates=$(printf '%s\n' "$updates" | jq --compact-output 'del(.kubectl, .talosctl)') || exit "$?"
        if [ "$updates" = "{}" ]; then
          exit 0
        fi
        if [ "$DRY_RUN" = false ]; then
          mise upgrade --bump --exclude kubectl --exclude talosctl --local --no-prune || exit "$?"
        fi
        printf '%s\n' "$updates"
