repos:
  - repo: builtin
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2
    hooks:
      - id: check-github-workflows
        files: ^\.github/workflows/.*\.yaml$
      - id: check-renovate
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: butane
        name: Check Host Configurations
        entry: mise exec -- sh -c 'for file in hosts/*/*.bu; do butane --files-dir hosts --strict "$file" >/dev/null || exit; done'
        files: ^hosts/
        language: system
        pass_filenames: false
      - id: prettier
        name: Check Formatting
        entry: mise exec -- prettier --check --ignore-unknown
        language: system
        require_serial: true
        types:
          - text
      - id: shellcheck
        name: Check Shell Scripts
        entry: mise exec -- shellcheck
        language: system
        require_serial: true
        types:
          - shell
      - id: tofu-fmt
        name: Check OpenTofu Formatting
        entry: mise exec -- tofu fmt -check
        files: \.tf$
        language: system
        require_serial: true
      - id: tofu-validate
        name: Validate OpenTofu Configuration
        entry: mise exec -- tofu validate
        files: (\.tf$|^\.terraform\.lock\.hcl$|^data/)
        language: system
        pass_filenames: false
