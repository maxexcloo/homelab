oidc_issuer_url: https://id.excloo.com
cloudflare_access:
  cluster: syd
  name: Excloo ID
  oidc_client_id: cloudflare-access-excloo_id
kubernetes:
  oidc_client_id: headlamp
onepassword:
  cluster_vault_prefix: "Kubelab "
  ownership_tag: Homelab
  vaults:
    flylab: Flylab
    homelab: Homelab
ssh:
  authorized_keys:
    - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaF+DCJq1CyGrafKzDMtNjW02M5XJoH5MLFFSlHPjyz Max Schaefer
  identity_agent: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock
tailscale:
  key_expiry_seconds: 7776000
  auto_approvers:
    exit_node:
      - tag:appliance
      - tag:backup
      - tag:router
      - tag:server
      - tag:vm
      - tag:workstation
    routes: {}
  default_tag_owners:
    - group:admin
  grants:
    - dst: &trusted_tags
        - tag:appliance
        - tag:backup
        - tag:cluster-syd
        - tag:ephemeral
        - tag:router
        - tag:server
        - tag:vm
        - tag:workstation
      ip:
        - "*"
      src: *trusted_tags
    - dst:
        - syd
      ip:
        - tcp:443
      src:
        - tag:ephemeral
    - dst:
        - "*"
        - autogroup:internet
      ip:
        - "*"
      src:
        - group:admin
    # SideStore reflects packets as new connections back to the requesting device.
    - dst:
        - group:admin
      ip:
        - "*"
      src:
        - 10.7.0.1/32
  groups:
    group:admin:
      - max@excloo.com
      - maxexcloo@passkey
  tags:
    - tag:appliance
    - tag:backup
    - tag:ephemeral
    - tag:router
    - tag:server
    - tag:vm
    - tag:workstation
