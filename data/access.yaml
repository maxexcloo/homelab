onepassword:
  cluster_vault_prefix: "Cluster: "
  vaults:
    homelab: Homelab
ssh:
  identity_agent: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock
tailscale:
  key_expiry_seconds: 7776000
  acls:
    - action: accept
      proto: icmp
      dst:
        - "tag:appliance:*"
        - "tag:router:*"
        - "tag:server:*"
        - "tag:vm:*"
      src:
        - tag:ephemeral
    - action: accept
      dst:
        - tag:appliance:80
        - tag:appliance:443
      src:
        - tag:ephemeral
    - action: accept
      dst:
        - "tag:router:*"
      src:
        - tag:ephemeral
    - action: accept
      dst:
        - tag:server:80
        - tag:server:443
      src:
        - tag:ephemeral
    - action: accept
      dst:
        - tag:vm:80
        - tag:vm:443
      src:
        - tag:ephemeral
    - action: accept
      dst:
        - tag:server:443
      src:
        - tag:appliance
    - action: accept
      dst:
        - tag:appliance:80
        - tag:appliance:443
      src:
        - tag:vm
    - action: accept
      dst:
        - tag:server:80
        - tag:server:443
      src:
        - tag:vm
    - action: accept
      dst:
        - tag:vm:80
        - tag:vm:443
      src:
        - tag:vm
    - action: accept
      dst:
        - tag:router:80
        - tag:router:443
      src:
        - tag:server
    - action: accept
      dst:
        - "tag:appliance:*"
      src:
        - tag:server
    - action: accept
      dst:
        - "tag:server:*"
      src:
        - tag:server
    - action: accept
      dst:
        - "tag:vm:*"
      src:
        - tag:server
    - action: accept
      dst:
        - "*:*"
      src:
        - group:admin
    - action: accept
      dst:
        - "tag:storage:*"
      src:
        - tag:backup
  auto_approvers:
    exit_node:
      - tag:router
    routes:
      "0.0.0.0/0":
        - tag:router
      "::/0":
        - tag:router
  groups:
    group:admin:
      - max@excloo.com
      - maxexcloo@passkey
  operator:
    scopes:
      - auth_keys
      - devices:core
  tag_owners:
    tag:appliance:
      - group:admin
    tag:backup:
      - group:admin
    tag:ephemeral:
      - group:admin
    tag:kubernetes:
      - group:admin
    tag:router:
      - group:admin
    tag:server:
      - group:admin
    tag:storage:
      - group:admin
    tag:vm:
      - group:admin
    tag:workstation:
      - group:admin
  tests:
    - src: max@excloo.com
      accept:
        - tag:kubernetes:50000
        - tag:storage:22
    - src: tag:mbk
      deny:
        - tag:server:443
    - src: tag:syd
      deny:
        - tag:server:443
