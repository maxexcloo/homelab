onepassword:
  cluster_vault_prefix: "Cluster: "
  vaults:
    homelab: Homelab
ssh:
  identity_agent: ~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock
tailscale:
  key_expiry_seconds: 7776000
  acls:
    - action: accept
      dst:
        - "autogroup:tagged:*"
      src:
        - autogroup:tagged
    - action: accept
      dst:
        - "*:*"
        - "autogroup:internet:*"
      src:
        - group:admin
  auto_approvers:
    exit_node:
      - tag:router
    routes:
      "0.0.0.0/0":
        - tag:router
      "::/0":
        - tag:router
  groups:
    group:admin:
      - max@excloo.com
      - maxexcloo@passkey
  operator:
    scopes:
      - auth_keys
      - devices:core
  tag_owners:
    tag:appliance:
      - group:admin
    tag:backup:
      - group:admin
    tag:ephemeral:
      - group:admin
    tag:kubernetes:
      - group:admin
    tag:router:
      - group:admin
    tag:server:
      - group:admin
    tag:storage:
      - group:admin
    tag:vm:
      - group:admin
    tag:workstation:
      - group:admin
