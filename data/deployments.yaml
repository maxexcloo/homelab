deployments:
  hsp:
    network: syd
    provider: oci
    boot:
      size_mib: 131072
    compute:
      cores: 2
      memory_mib: 12288
    oci:
      assign_public_ip: true
      shape: VM.Standard.A1.Flex
  taco:
    host: kimbap
    provider: truenas
    boot:
      iso_directory: /mnt/truenas-nvme/virtual-machines
      pool: truenas-nvme
      size_mib: 65536
    compute:
      cores: 12
      memory_mib: 32768
      sockets: 1
      threads: 1
