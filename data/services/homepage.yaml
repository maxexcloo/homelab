# yaml-language-server: $schema=../../schemas/service.json
dashboard: []
credentials:
  fields:
    tailscale_homepage_widget_key: {}
data:
  groups:
    Applications:
      columns: 4
      style: row
    Home Automation:
      columns: 4
      style: row
    Infrastructure:
      columns: 2
      style: row
    Media:
      columns: 4
      style: row
  settings:
    cardBlur: xs
    color: slate
    disableCollapse: true
    headerStyle: clean
    hideVersion: true
    statusStyle: dot
    theme: dark
    title: ${service.identity.title}
    background:
      brightness: 50
      image: /images/background.jpg
  widgets:
    - search:
        provider: google
        target: _blank
identity:
  description: Application Dashboard
  group: Applications
  service: homepage
  title: Homepage
routing:
  default:
    expose: internal
    host: home.excloo.com
    backend:
      port: 30054
      published_port: 30054
targets:
  au-truenas: {}
