# yaml-language-server: $schema=../../schemas/service.json
credentials:
  generated:
    agent:
      type: x509
dashboard:
  - {}
data:
  monitoring_status_codes:
    - 200
    - 401
features:
  oidc_forward_auth: true
identity:
  description: Container Log Viewer
  group: Infrastructure
  service: dozzle
  title: Dozzle
  username: max@excloo.com
routing:
  default:
    backend_port: 30064
    expose: internal
    host: null

    redirects:
      - dozzle.excloo.com
targets:
  au-truenas:
    truenas:
      env:
        DOZZLE_AUTH_HEADER_EMAIL: X-Auth-Request-Email
        DOZZLE_AUTH_HEADER_NAME: X-Auth-Request-Preferred-Username
        DOZZLE_AUTH_HEADER_USER: X-Auth-Request-User
        DOZZLE_AUTH_PROVIDER: forward-proxy
        DOZZLE_CERT: /managed/dozzle_cert.pem
        DOZZLE_ENABLE_ACTIONS: true
        DOZZLE_ENABLE_MCP: true
        DOZZLE_ENABLE_SHELL: true
        DOZZLE_HOSTNAME: ${server.key}
        DOZZLE_KEY: /managed/dozzle_key.pem
        DOZZLE_NO_ANALYTICS: true
