# yaml-language-server: $schema=../../schemas/service.json
credentials:
  generated:
    bootstrap_token:
      length: 16
      type: hex
    db_password:
      length: 32
      type: alphanumeric
    email_encryption_key:
      length: 32
      type: hex
    jwt_secret:
      length: 32
      type: hex
    migration_encryption_key:
      length: 32
      type: hex
dashboard:
  - {}
data:
  oidc_callback_urls:
    - /oauth2-callback
features:
  mail: true
  oidc: true
  password: true
identity:
  description: Digital Library
  group: Media
  service: bookorbit
  title: BookOrbit
  username: maxexcloo
  access_groups:
    - books
routing:
  backend_port: 30396
  routes:
    - expose: cloudflare
      host: books.excloo.com
targets:
  au-truenas:
    truenas:
      env:
        APP_URL: ${service.urls.default.href}
        CLIENT_URL: ${service.urls.default.href}
        EMAIL_ENCRYPTION_KEY: ${service.runtime.credentials.email_encryption_key}
        LIBRARY_BROWSE_ROOT: /books
        MIGRATION_ENCRYPTION_KEY: ${service.runtime.credentials.migration_encryption_key}
