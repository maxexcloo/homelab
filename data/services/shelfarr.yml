# yaml-language-server: $schema=../../schemas/service.json
dashboard:
  - icon: sh-shelfarr
data:
  oidc_callback_urls:
    - /auth/oidc/callback
features:
  oidc: true
  password: true
identity:
  description: Book Requests & Downloads
  group: Media
  service: shelfarr
  title: Shelfarr
  username: maxexcloo
  access_groups:
    - books
imports:
  services:
    byparr: byparr-au-truenas
routing:
  backend_port: 30260
  routes:
    - expose: cloudflare
      host: shelf.excloo.com
targets:
  au-truenas:
    data:
      environment:
        CHOWN_ON_START: auto
        HTTP_PORT: ${service.routing.backend_port}
        PGID: 568
        PUID: 568
        SHELFARR_SETTING_FLARESOLVERR_URL: ${services.byparr.urls.default.href}
        SHELFARR_SETTING_OIDC_AUTO_CREATE_USERS: true
        SHELFARR_SETTING_OIDC_AUTO_REDIRECT: true
        SHELFARR_SETTING_OIDC_CLIENT_ID: ${service.runtime.credentials.oidc_client_id}
        SHELFARR_SETTING_OIDC_CLIENT_SECRET: ${service.runtime.credentials.oidc_client_secret}
        SHELFARR_SETTING_OIDC_DEFAULT_ROLE: user
        SHELFARR_SETTING_OIDC_ENABLED: true
        SHELFARR_SETTING_OIDC_ISSUER: ${service.runtime.attributes.oidc_issuer_url}
        SHELFARR_SETTING_OIDC_PROVIDER_NAME: ${service.runtime.attributes.oidc_provider_name}
        SHELFARR_SETTING_OIDC_SCOPES: openid profile email
        SOLID_QUEUE_IN_PUMA: 1
