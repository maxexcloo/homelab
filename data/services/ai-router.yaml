# yaml-language-server: $schema=../../schemas/service.json
credentials:
  generated:
    cliproxy_api_key:
      length: 32
      type: alphanumeric
    comfy_control_api_key:
      length: 32
      type: alphanumeric
dashboard:
  - name: Bifrost
    description: LLM Gateway
    href: https://bifrost.excloo.com
    icon: https://cdn.jsdelivr.net/gh/maximhq/bifrost@108a8c69d7e55029e4e1943be21e6ccfc7757c56/ui/public/bifrost-icon-dark.webp
    siteMonitor: https://bifrost.excloo.com
  - name: CLIProxyAPI
    description: Subscription Proxy
    href: https://cliproxy.excloo.com/management.html
    icon: https://cdn.jsdelivr.net/gh/router-for-me/Cli-Proxy-API-Management-Center@f60c8ca683b118be5750ff102187cc6d8ad4605b/logo.jpg
    siteMonitor: https://cliproxy.excloo.com/management.html
  - name: AI Router
    description: Media Inference Controller
    href: https://ai-router.excloo.com
    icon: mdi-tune-vertical-#3b82f6
    siteMonitor: https://ai-router.excloo.com
features:
  monitoring: false
  password: true
identity:
  description: AI Inference Gateway
  group: Infrastructure
  service: ai-router
  title: AI Router
  username: max@excloo.com
routing:
  backend_port: 8080
  container: bifrost
  routes:
    - id: bifrost
      expose: internal
      host: bifrost.excloo.com
    - id: cliproxy
      backend_port: 8317
      container: cliproxy
      expose: internal
      host: cliproxy.excloo.com
    - id: control
      backend_port: 8000
      container: comfy-control
      expose: internal
      host: ai-router.excloo.com
targets:
  au-truenas: {}
