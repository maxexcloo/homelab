# yaml-language-server: $schema=../../schemas/service.json
credentials:
  fields:
    civitai_api_key: {}
    huggingface_token: {}
    runpod_api_key: {}
    salad_api_key: {}
    vast_api_key: {}
  generated:
    bifrost_api_key:
      length: 32
      type: alphanumeric
    bifrost_encryption_key:
      length: 32
      type: hex
    cliproxy_api_key:
      length: 32
      type: alphanumeric
    comfy_control_api_key:
      length: 32
      type: alphanumeric
    worker_api_key:
      length: 32
      type: alphanumeric
dashboard:
  - name: Bifrost
    description: LLM Gateway
    href: ${service.routing.default.href}
    icon: https://cdn.jsdelivr.net/gh/maximhq/bifrost@108a8c69d7e55029e4e1943be21e6ccfc7757c56/ui/public/bifrost-icon-dark.webp
    siteMonitor: ${service.routing.default.href}
  - name: CLIProxyAPI
    description: Subscription Proxy
    href: ${service.routing.cliproxy.href}
    icon: https://cdn.jsdelivr.net/gh/router-for-me/Cli-Proxy-API-Management-Center@f60c8ca683b118be5750ff102187cc6d8ad4605b/logo.jpg
    siteMonitor: ${service.routing.cliproxy.href}
  - name: ${service.identity.title}
    description: ${service.identity.description}
    href: ${service.routing.control.href}
    icon: mdi-tune-vertical-#3b82f6
    siteMonitor: ${service.routing.control.href}
features:
  monitoring: false
  password: true
identity:
  description: AI Inference Gateway
  group: Infrastructure
  service: ai-router
  title: AI Router
  username: max@excloo.com
routing:
  cliproxy:
    container: cliproxy
    expose: internal
    host: cliproxy.excloo.com
    path: /management.html
    backend:
      port: 8317
  control:
    container: comfy-control
    expose: internal
    host: ai-router.excloo.com
    backend:
      port: 8000
  default:
    container: bifrost
    expose: internal
    host: bifrost.excloo.com
    backend:
      port: 8080
targets:
  au-truenas: {}
