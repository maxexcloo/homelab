# yaml-language-server: $schema=../../schemas/service.json
credentials:
  fields:
    civitai_api_key: {}
    huggingface_token: {}
    runpod_api_key: {}
    salad_api_key: {}
    vast_api_key: {}
  generated:
    bifrost_api_key:
      length: 32
      type: alphanumeric
    bifrost_encryption_key:
      length: 32
      type: hex
    cliproxy_api_key:
      length: 32
      type: alphanumeric
    comfy_control_api_key:
      length: 32
      type: alphanumeric
    worker_api_key:
      length: 32
      type: alphanumeric
dashboard:
  - name: Bifrost
    description: LLM Gateway
    href: ${service.routing.routes[0].href}
    icon: https://cdn.jsdelivr.net/gh/maximhq/bifrost@108a8c69d7e55029e4e1943be21e6ccfc7757c56/ui/public/bifrost-icon-dark.webp
    siteMonitor: ${service.routing.routes[0].href}
  - name: CLIProxyAPI
    description: Subscription Proxy
    href: ${service.routing.routes[1].href}/management.html
    icon: https://cdn.jsdelivr.net/gh/router-for-me/Cli-Proxy-API-Management-Center@f60c8ca683b118be5750ff102187cc6d8ad4605b/logo.jpg
    siteMonitor: ${service.routing.routes[1].href}/management.html
  - name: ${service.identity.title}
    description: ${service.identity.description}
    href: ${service.routing.routes[2].href}
    icon: mdi-tune-vertical-#3b82f6
    siteMonitor: ${service.routing.routes[2].href}
features:
  monitoring: false
  password: true
identity:
  description: AI Inference Gateway
  group: Infrastructure
  service: ai-router
  title: AI Router
  username: max@excloo.com
routing:
  backend_port: 8080
  container: bifrost
  routes:
    - id: bifrost
      expose: internal
      host: bifrost.excloo.com
    - id: cliproxy
      backend_port: 8317
      container: cliproxy
      expose: internal
      host: cliproxy.excloo.com
    - id: control
      backend_port: 8000
      container: comfy-control
      expose: internal
      host: ai-router.excloo.com
targets:
  au-truenas: {}
