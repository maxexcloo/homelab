# yaml-language-server: $schema=../../schemas/service.json
credentials:
  generated:
    cliproxy_api_key:
      length: 32
      type: alphanumeric
    comfy_control_api_key:
      length: 32
      type: alphanumeric
dashboard:
  - name: Bifrost
    description: LLM Gateway
    href: https://bifrost.excloo.com
    icon: mdi-bridge-#8b5cf6
    siteMonitor: https://bifrost.excloo.com
  - name: CLIProxyAPI
    description: Subscription Proxy
    href: https://cliproxy.excloo.com/management.html
    icon: mdi-console-network-outline-#22c55e
    siteMonitor: https://cliproxy.excloo.com/management.html
  - name: AI Router
    description: Media Inference Controller
    href: https://ai-router.excloo.com
    icon: mdi-tune-vertical-#3b82f6
    siteMonitor: https://ai-router.excloo.com
features:
  monitoring: false
  password: true
identity:
  description: AI Inference Gateway
  group: Infrastructure
  service: ai-router
  title: AI Router
  username: admin
routing:
  backend_port: 8080
  container: bifrost
  routes:
    - id: bifrost
      expose: internal
      host: bifrost.excloo.com
    - id: cliproxy
      backend_port: 8317
      container: cliproxy
      expose: internal
      host: cliproxy.excloo.com
    - id: control
      backend_port: 8000
      container: comfy-control
      expose: internal
      host: ai-router.excloo.com
targets:
  au-truenas: {}
