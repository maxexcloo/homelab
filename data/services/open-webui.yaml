# yaml-language-server: $schema=../../schemas/service.json
credentials:
  generated:
    redis_password:
      length: 32
      type: alphanumeric
    webui_secret_key:
      length: 64
      type: hex
dashboard:
  - {}
data:
  oidc_pkce_enabled: true
  oidc_callback_urls:
    - /oauth/oidc/callback
features:
  oidc: true
  password: true
identity:
  description: AI Chat
  group: AI
  service: open-webui
  title: Open WebUI
  username: max@excloo.com
routing:
  default:
    expose: cloudflare
    host: chat.excloo.com
    backend:
      port: 31028
targets:
  au-truenas:
    truenas:
      env:
        DEFAULT_USER_ROLE: user
        ENABLE_OAUTH_ID_TOKEN_COOKIE: false
        ENABLE_OAUTH_SIGNUP: true
        ENABLE_SIGNUP: false
        OAUTH_CLIENT_ID: ${service.runtime.credentials.oidc_client_id}
        OAUTH_CLIENT_SECRET: ${service.runtime.credentials.oidc_client_secret}
        OAUTH_CODE_CHALLENGE_METHOD: S256
        OAUTH_PROVIDER_NAME: ${service.runtime.attributes.oidc_provider_name}
        OPENID_PROVIDER_URL: ${service.runtime.attributes.oidc_issuer_url}/.well-known/openid-configuration
        OPENID_REDIRECT_URI: ${service.urls.default.href}/oauth/oidc/callback
        WEBUI_ADMIN_EMAIL: ${service.identity.username}
        WEBUI_ADMIN_NAME: ${defaults.organisation.owner}
        WEBUI_ADMIN_PASSWORD: ${service.runtime.credentials.password}
        WEBUI_URL: ${service.urls.default.href}
