cloudflare:
  account_name: excloo
  acme_consumers:
    bento: delegated
    gateway: delegated
    hass: delegated
    hotdog: delegated
    kimbap: direct
    mbk: delegated
    syd: delegated
  external_dns_consumers:
    mbk:
      - excloo.com
      - excloo.dev
    syd:
      - excloo.com
      - excloo.dev
  tunnel_consumers:
    hass:
      fallback_service: http_status:404
      ingress:
        - hostname: home-assistant.excloo.com
          path: ^/api/webhook/.+$
          service: https://homeassistant
          zone: excloo.com
          origin_request:
            no_tls_verify: true
    hotdog: {}
    kimbap: {}
    mandu: {}
    mbk: {}
    syd: {}
  waf_zones:
    - excloo.com
domains:
  acme: 043847.xyz
  infrastructure: excloo.net
  services: excloo.dev
