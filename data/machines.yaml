          group: Smart Home
          icon: sh-home-assistant
          monitoring: true
          name: Home Assistant
          port: 443
          scheme: https
          widget:
            key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_ACCESS_TOKEN}}"
