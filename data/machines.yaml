          name: NanoKVM
          port: 80
          scheme: http
    saturn:
      beszel: true
      platform: truenas
      smtp: resend
      type: server
      username: root
      backblaze:
        bucket_name: au-truenas-494jkq
      cloudflare:
        acme: direct
        tunnel: {}
      cronjobs:
        icloud-photos-check:
          command: /bin/bash /mnt/truenas/icloud-photos/.rclone/icloud-files-check.sh
          description: iCloud Photos Check
          schedule_dow: "*"
          schedule_hour: "6"
          user: root
        icloud-photos-copy:
          command: /bin/bash /mnt/truenas/icloud-photos/.rclone/icloud-files-copy.sh
          description: iCloud Photos Copy
          schedule_dow: "*"
          schedule_hour: "3"
          user: root
        smart-long:
          command: midclt call disk.smart_test LONG '["*"]'
          description: S.M.A.R.T. Test
          schedule_dow: "1"
          schedule_hour: "0"
          schedule_minute: "00"
          user: root
        smart-short:
          command: midclt call disk.smart_test SHORT '["*"]'
          description: S.M.A.R.T. Test
          schedule_dow: 2,3,4,5,6
          schedule_hour: "0"
          schedule_minute: "00"
          user: root
      init_scripts:
        crucial-x9-trim:
          command: >-
            mkdir -p /run/udev/rules.d && printf '%s\n' 'ACTION=="add|change", SUBSYSTEM=="block", ENV{DEVTYPE}=="disk", ATTRS{idVendor}=="0634", ATTRS{idProduct}=="5605", ATTRS{serial}=="2332E8DB0370|2332E8DB0C47", ATTR{device/scsi_disk/*/provisioning_mode}="unmap"' > /run/udev/rules.d/90-crucial-x9-unmap.rules && udevadm control --reload-rules && udevadm trigger --action=change --subsystem-match=block --property-match=ID_VENDOR_ID=0634 --property-match=ID_MODEL_ID=5605 && udevadm settle --timeout=15
          comment: Enable Crucial X9 TRIM
          timeout: 30
          type: COMMAND
          when: PREINIT
      interfaces:
        - name: eno1
          address: 10.0.0.3
          mac_address: c8:ff:bf:01:52:e0
        - name: enp2s0
          address: 10.4.0.3
          bridge: br4
          bridge_mac_address: e2:2a:94:db:be:24
          mac_address: c8:ff:bf:01:52:e1
      network_configuration:
        ipv6gateway: fe80::2870:4eff:fe6e:59cc
      service_settings:
        cifs: true
        ssh: true
        ups: true
      services:
        management:
          description: Storage Appliance
          group: Infrastructure
          icon: sh-truenas-scale
          monitoring: true
          name: TrueNAS
          port: 443
          scheme: https
          widget:
            enablePools: true
            key: "{{HOMEPAGE_VAR_TRUENAS_API_KEY}}"
            type: truenas
            version: 2
        netboot:
          description: Network Boot Server
          group: Infrastructure
          icon: mdi-server-network-#ffffff
          monitoring: true
          name: Netboot
          port: 31010
          scheme: http
        s3:
          bucket: syd-backups
          name: Object Storage
          port: 9000
          scheme: https
          username: syd-backups
      smb:
        aapl_extensions: true
      ssh:
        passwordauth: false
        tcpfwd: true
      tunables:
        net.core.rmem_max:
          type: SYSCTL
          value: "8388608"
        net.core.wmem_max:
          type: SYSCTL
          value: "8388608"
        net.ipv4.conf.all.forwarding:
          type: SYSCTL
          value: "1"
        net.ipv6.conf.all.forwarding:
          type: SYSCTL
          value: "1"
      ups:
        driver: usbhid-ups$CP1500AVRLCD
        port: auto
        remotehost: study-homelab-ups.internal
        shutdown: LOWBATT
    macbook-pro:
