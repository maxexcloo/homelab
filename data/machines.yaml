      type: appliance
      username: root
      backblaze:
        bucket_name: au-haos-rt81yb
      cloudflare:
        acme: delegated
        tunnel:
          fallback_service: http_status:404
          ingress:
            - hostname: home-assistant.excloo.com
              path: ^/api/webhook/.+$
              service: https://homeassistant
              origin_request:
                no_tls_verify: true
      interfaces:
        - address: 10.0.0.2
          mac_address: 84:47:09:67:c8:33
        - address: 10.4.0.2
          mac_address: 84:47:09:67:c8:36
