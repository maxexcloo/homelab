clusters:
  mbk:
    api_node: taco
    backblaze: true
    kubernetes_version: v1.37.1
    pod_subnet: 10.100.0.0/22
    service_subnet: 10.100.4.0/22
    talos_version: v1.14.2
    cloudflare:
      acme: delegated
      tunnel: {}
      waf: true
      external_dns:
        - excloo.com
        - excloo.dev
    image:
      architecture: amd64
      platform: metal
      extensions:
        - siderolabs/qemu-guest-agent
        - siderolabs/tailscale
    nodes:
      taco:
        bootstrap: true
        configuration_delivery: api
        install_disk: /dev/vda
        machine_type: controlplane
        sysctls:
          user.max_user_namespaces: "1024"
        tailscale_routes:
          - 10.4.0.0/22
  syd:
    api_node: hsp
    backblaze: true
    kubernetes_version: v1.37.1
    pod_subnet: 10.100.8.0/22
    service_subnet: 10.100.12.0/22
    talos_version: v1.14.2
    cloudflare:
      acme: delegated
      tunnel: {}
      waf: true
      external_dns:
        - excloo.com
        - excloo.dev
    image:
      architecture: arm64
      bucket_name: homelab-talos-images
      platform: oracle
      extensions:
        - siderolabs/tailscale
    nodes:
      hsp:
        bootstrap: true
        configuration_delivery: metadata
        machine_type: controlplane
        tailscale_routes:
          - 10.20.0.0/24
        time_servers:
          - 169.254.169.254
