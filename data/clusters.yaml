clusters:
  mbk:
    api_node: taco
    kubernetes_version: v1.36.4
    pod_subnet: 10.100.0.0/22
    service_subnet: 10.100.4.0/22
    talos_enabled: true
    talos_version: v1.13.9
    image:
      architecture: amd64
      platform: metal
      extensions:
        - siderolabs/qemu-guest-agent
        - siderolabs/tailscale
    nodes:
      taco:
        bootstrap: true
        configuration_delivery: api
        install_disk: /dev/vda
        machine_type: controlplane
        sysctls:
          user.max_user_namespaces: "1024"
        tailscale_routes:
          - 10.4.0.0/22
  syd:
    api_node: hsp
    kubernetes_version: v1.36.4
    pod_subnet: 10.100.8.0/22
    service_subnet: 10.100.12.0/22
    talos_enabled: true
    talos_version: v1.13.9
    image:
      architecture: arm64
      bucket_name: homelab-talos-images
      operating_system: Talos
      platform: oracle
      extensions:
        - siderolabs/tailscale
    nodes:
      hsp:
        bootstrap: true
        configuration_delivery: metadata
        machine_type: controlplane
        tailscale_routes:
          - 10.20.0.0/24
        time_servers:
          - 169.254.169.254
