clusters:
  syd:
    api_node: kimbap
    backblaze: true
    pod_subnet: 10.100.0.0/22
    public_node: hsp
    service_subnet: 10.100.4.0/22
    tailscale_ingress_ipv6: false
    tailscale_ingress_service: syd-ingress
    cloudflare:
      access_applications: true
      acme: delegated
      tunnel: {}
      waf: true
      external_dns:
        - excloo.com
        - excloo.dev
    image:
      architecture: arm64
      bucket_name: homelab-talos-images
      platform: oracle
      extensions:
        - siderolabs/tailscale
    nodes:
      hsp:
        configuration_delivery: metadata
        machine_type: worker
        time_servers:
          - 169.254.169.254
      kimbap:
        address: 10.4.0.7
        bootstrap: true
        configuration_delivery: container
        machine_type: controlplane
        tailscale_address: 100.120.55.119
        container:
          dataset: truenas-nvme/talos
          mac: 02:74:61:63:6f:01
          memory_gib: 32
          datasets:
            - name: truenas-nvme/bichon
            - name: truenas-nvme/bookorbit
            - name: truenas-nvme/immich
            - name: truenas-nvme/papra
            - name: truenas-nvme/romm
            - name: truenas-nvme/studio
            - name: truenas/backups
            - name: truenas/documents
            - name: truenas/games
            - name: truenas/icloud-photos
              read_only: true
            - name: truenas/projects
            - name: truenas/public
      venus:
        configuration_delivery: direct
        dedicated: gpu
        install_disk_selector: 'disk.transport == "nvme" && disk.model.matches(".*OM8PGP42048N-A0.*")'
        machine_type: worker
        configuration:
          - apiVersion: v1alpha1
            kind: UserVolumeConfig
            name: datasets
            volumeType: directory
          - apiVersion: v1alpha1
            kind: UdevRulesConfig
            rules:
              # Match both R9700s by hardware identity, not hwmon index.
              - 'ACTION=="add", SUBSYSTEM=="hwmon", ATTRS{vendor}=="0x1002", ATTRS{device}=="0x7551", ATTR{power1_cap}="210000000"'
        image:
          architecture: amd64
          platform: metal
          extensions:
            - siderolabs/amd-ucode
            - siderolabs/amdgpu
            - siderolabs/realtek-firmware
            - siderolabs/tailscale
