clusters:
  syd:
    api_node: kimbap
    backblaze: true
    # renovate: datasource=github-tags depName=kubernetes packageName=kubernetes/kubernetes
    kubernetes_version: v1.37.1
    pod_subnet: 10.100.0.0/22
    public_node: hsp
    service_subnet: 10.100.4.0/22
    tailscale_ingress_ipv6: false
    tailscale_ingress_service: syd-ingress
    # renovate: datasource=github-tags depName=talos packageName=siderolabs/talos
    talos_version: v1.14.4
    cloudflare:
      acme: delegated
      tunnel: {}
      waf: true
      external_dns:
        - excloo.com
        - excloo.dev
    image:
      architecture: arm64
      bucket_name: homelab-talos-images
      platform: oracle
      extensions:
        - siderolabs/tailscale
    nodes:
      bento:
        address: 10.0.0.7
        configuration_delivery: container
        dedicated: gpu
        machine_type: worker
        container:
          app_name: talos
          mac: 02:74:61:63:6f:02
          paths:
            - /var/home/core/ai
      hsp:
        configuration_delivery: metadata
        machine_type: worker
        time_servers:
          - 169.254.169.254
      kimbap:
        address: 10.4.0.7
        bootstrap: true
        configuration_delivery: container
        machine_type: controlplane
        tailscale_address: 100.120.55.119
        container:
          app_name: talos
          dataset: truenas-nvme/talos
          mac: 02:74:61:63:6f:01
          memory_gib: 32
          datasets:
            - name: truenas-nvme/bichon
            - name: truenas-nvme/bookorbit
            - name: truenas-nvme/immich
            - name: truenas-nvme/papra
            - name: truenas-nvme/romm
            - name: truenas-nvme/studio
            - name: truenas/backups
            - name: truenas/documents
            - name: truenas/games
            - name: truenas/icloud-photos
              read_only: true
            - name: truenas/projects
            - name: truenas/public
      mandu:
        address: 10.4.0.8
        configuration_delivery: container
        dedicated: gaming
        machine_type: worker
        container:
          app_name: talos
          mac: 02:74:61:63:6f:03
          paths:
            - /var/home/max.schaefer/ai
