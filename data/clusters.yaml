clusters:
  syd:
    api_node: kimbap
    backblaze: true
    kubernetes_version: v1.37.1
    pod_subnet: 10.100.0.0/22
    public_node: hsp
    service_subnet: 10.100.4.0/22
    tailscale_ingress_ipv6: false
    tailscale_ingress_service: syd-ingress
    talos_version: v1.14.4
    cloudflare:
      acme: delegated
      tunnel: {}
      waf: true
      external_dns:
        - excloo.com
        - excloo.dev
    image:
      architecture: arm64
      bucket_name: homelab-talos-images
      platform: oracle
      extensions:
        - siderolabs/tailscale
    nodes:
      hsp:
        configuration_delivery: metadata
        machine_type: worker
        tailscale_routes:
          - 10.20.0.0/24
        time_servers:
          - 169.254.169.254
      kimbap:
        address: 10.4.0.7
        bootstrap: true
        configuration_delivery: container
        machine_type: controlplane
        tailscale_address: 100.120.55.119
        tailscale_tag: tag:vm
        container:
          app_name: talos
          dataset: truenas-nvme/talos
          mac: 02:74:61:63:6f:01
          memory_gib: 32
          datasets:
            - name: truenas-nvme/bichon
            - name: truenas-nvme/bookorbit
            - name: truenas-nvme/immich
            - name: truenas-nvme/papra
            - name: truenas-nvme/romm
            - name: truenas/games
            - name: truenas/icloud-photos
              read_only: true
          host_paths:
            - source: /mnt/truenas
              target: /var/mnt/datasets/truenas
        tailscale_routes:
          - 10.4.0.0/22
