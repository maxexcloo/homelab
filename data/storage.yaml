backblaze:
  endpoint: https://s3.us-east-005.backblazeb2.com
  hosts:
    hass:
      bucket_name: au-haos-rt81yb
    kimbap:
      bucket_name: au-truenas-494jkq
truenas:
  kimbap:
    dataset_defaults:
      atime: "OFF"
      compression: LZ4
      pool: truenas-nvme
      record_size: 128K
    datasets:
      clusters: {}
      mbk:
        parent_dataset: clusters
    nfs_share_defaults:
      networks:
        - network: mbk
          subnet: services
    nfs_shares:
      bichon:
        path: /mnt/truenas-nvme/bichon
      bookorbit:
        path: /mnt/truenas-nvme/bookorbit
      clusters-mbk:
        dataset: mbk
      icloud-photos:
        path: /mnt/truenas/icloud-photos
        readonly: true
      immich:
        path: /mnt/truenas-nvme/immich
      papra:
        path: /mnt/truenas-nvme/papra
      romm:
        path: /mnt/truenas-nvme/romm
