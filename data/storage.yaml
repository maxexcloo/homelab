truenas:
  kimbap:
    dataset_defaults:
      atime: "OFF"
      compression: LZ4
      pool: truenas-nvme
      record_size: 128K
    datasets:
      clusters: {}
      clusters-backups:
        name: clusters
        pool: truenas
      mbk:
        parent_dataset: clusters
      mbk-backups:
        name: mbk
        parent_dataset: clusters-backups
        pool: truenas
    nfs_share_defaults:
      clients:
        - taco
    nfs_shares:
      bichon:
        path: /mnt/truenas-nvme/bichon
      bookorbit:
        path: /mnt/truenas-nvme/bookorbit
      clusters-mbk:
        dataset: mbk
      clusters-mbk-backups:
        dataset: mbk-backups
      games:
        path: /mnt/truenas/games
      icloud-photos:
        path: /mnt/truenas/icloud-photos
        readonly: true
      immich:
        path: /mnt/truenas-nvme/immich
      papra:
        path: /mnt/truenas-nvme/papra
      romm:
        path: /mnt/truenas-nvme/romm
