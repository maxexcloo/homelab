targets:
  kimbap:
    datasets:
      clusters:
        atime: "OFF"
        compression: LZ4
        pool: truenas-nvme
        record_size: 128K
      mbk:
        atime: "OFF"
        compression: LZ4
        parent_dataset: clusters
        pool: truenas-nvme
        record_size: 128K
    nfs_shares:
      bichon:
        path: /mnt/truenas-nvme/bichon
        networks:
          - network: mbk
            vlan: services
      bookorbit:
        path: /mnt/truenas-nvme/bookorbit
        networks:
          - network: mbk
            vlan: services
      clusters-mbk:
        dataset: mbk
        networks:
          - network: mbk
            vlan: services
      icloud-photos:
        path: /mnt/truenas/icloud-photos
        readonly: true
        networks:
          - network: mbk
            vlan: services
      immich:
        path: /mnt/truenas-nvme/immich
        networks:
          - network: mbk
            vlan: services
      papra:
        path: /mnt/truenas-nvme/papra
        networks:
          - network: mbk
            vlan: services
      romm:
        path: /mnt/truenas-nvme/romm
        networks:
          - network: mbk
            vlan: services
