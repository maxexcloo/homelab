dns:
  fastmail:
    - type: CNAME
      name: fm1._domainkey
      content: fm1.{domain}.dkim.fmhosted.com
    - type: CNAME
      name: fm2._domainkey
      content: fm2.{domain}.dkim.fmhosted.com
    - type: CNAME
      name: fm3._domainkey
      content: fm3.{domain}.dkim.fmhosted.com
    - type: MX
      name: "@"
      content: in1-smtp.messagingengine.com
      priority: 10
    - type: MX
      name: "@"
      content: in2-smtp.messagingengine.com
      priority: 20
    - type: TXT
      name: "@"
      id: txt-apex-spf
      content: '"v=spf1 include:spf.messagingengine.com ?all"'
  resend:
    cname: true
    region: us-east-1
providers:
  1password:
    description: Passwords & Secrets
    icon: si-1password-#ffffff
    name: 1Password
    url: https://my.1password.com
  backblaze:
    description: Object Storage
    endpoint: https://s3.us-east-005.backblazeb2.com
    icon: si-backblaze-#ffffff
    name: Backblaze
    url: https://backblaze.com
  cloudflare:
    account_name: excloo
    description: DNS & Zero Trust
    icon: si-cloudflare-#ffffff
    name: Cloudflare
    url: https://dash.cloudflare.com
    dns:
      query-type: A
      url: 1.1.1.1
    widget:
      key: "{{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}"
      type: cloudflared
  control_d:
    description: DNS Filtering
    icon: sh-control-d
    name: Control D
    url: https://controld.com
    dns:
      query-type: A
      url: 76.76.2.0
  fly:
    description: App Platform
    icon: si-flydotio-#ffffff
    name: Fly.io
    url: https://fly.io/dashboard
  gatus:
    description: Health Monitoring & Status Page • fly
    group: Operations
    icon: sh-gatus
    monitoring: false
    name: Gatus
    url: https://status.excloo.com
    widget:
      type: gatus
  github:
    description: Source Control
    icon: si-github-#ffffff
    name: GitHub
    url: https://github.com/maxexcloo
  oracle_cloud:
    description: Cloud VMs
    icon: si-oracle-#ffffff
    name: Oracle Cloud
    url: https://cloud.oracle.com
  resend:
    description: Email API
    icon: si-resend-#ffffff
    name: Resend
    url: https://resend.com/overview
  tailscale:
    description: VPN
    icon: tailscale-light
    name: Tailscale
    url: https://login.tailscale.com/admin
    widget:
      key: "{{HOMEPAGE_VAR_TAILSCALE_API_TOKEN}}"
      type: tailscale
  unifi:
    description: Network
    icon: si-ubiquiti-#ffffff
    name: UniFi
    url: https://unifi.ui.com
