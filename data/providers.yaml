providers:
  1Password:
    description: Passwords & Secrets
    icon: si-1password-#ffffff
    url: https://my.1password.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  Backblaze:
    description: Object Storage
    icon: si-backblaze-#ffffff
    url: https://backblaze.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  Cloudflare:
    description: DNS & Zero Trust
    icon: si-cloudflare-#ffffff
    url: https://dash.cloudflare.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
      - url: 1.1.1.1
        alerts:
          - type: email
        conditions:
          - "[CONNECTED] == true"
          - "[DNS_RCODE] == NOERROR"
          - "[RESPONSE_TIME] < 5000"
        dns:
          query-type: A
    homepage:
      description: Cloudflare Tunnel
      icon: cloudflare
      name: Cloudflare Tunnel
      widget:
        key: "{{HOMEPAGE_FILE_CLOUDFLARE_KEY}}"
        type: cloudflared
  Control D:
    description: DNS
    icon: sh-control-d-light
    url: https://controld.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
      - url: 76.76.2.0
        alerts:
          - type: email
        conditions:
          - "[CONNECTED] == true"
          - "[DNS_RCODE] == NOERROR"
          - "[RESPONSE_TIME] < 5000"
        dns:
          query-type: A
  Fly.io:
    description: App Platform
    icon: si-flydotio-#ffffff
    url: https://fly.io/dashboard
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  GitHub:
    description: Source Control
    icon: si-github-#ffffff
    url: https://github.com/maxexcloo
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  Oracle Cloud:
    description: Cloud VMs
    icon: si-oracle-#ffffff
    url: https://cloud.oracle.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  Resend:
    description: Email API
    icon: si-resend-#ffffff
    url: https://resend.com/overview
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
  Tailscale:
    description: VPN
    icon: si-tailscale-#ffffff
    url: https://login.tailscale.com/admin
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
    homepage:
      description: VPN
      icon: tailscale
      name: Tailscale
      widget:
        key: "{{HOMEPAGE_FILE_TAILSCALE_KEY}}"
        type: tailscale
  UniFi:
    description: Network
    icon: si-ubiquiti-#ffffff
    url: https://unifi.ui.com
    gatus:
      - alerts:
          - type: email
        conditions:
          - "[STATUS] == any(200, 401, 403)"
          - "[RESPONSE_TIME] < 5000"
