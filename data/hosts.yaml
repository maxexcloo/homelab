hosts:
  bento:
    files:
      - group: core
        local: data/hosts/bento/btop.conf
        mode: "0644"
        path: /var/home/core/.config/btop/btop.conf
        user: core
      - group: core
        local: data/hosts/bento/trcc.json
        mode: "0644"
        path: /var/home/core/.trcc/trcc.json
        user: core
    groups: []
    hostname: bento
    image: ghcr.io/ublue-os/ucore-hci:stable
    interface: enp3s0
    kernel_arguments:
      - fbcon=rotate:3
      - quiet
      - systemd.show_status=false
    linger: true
    links:
      - group: core
        path: /var/home/core/.config/systemd/user/default.target.wants/trccd.service
        target: /etc/systemd/user/trccd.service
        user: core
    trees:
      - local: templates/hosts/common/etc
        path: /etc
      - local: data/hosts/bento/etc
        path: /etc
    units:
      - enabled: true
        name: bento-display-packages.service
      - enabled: true
        name: btop-display.service
      - enabled: false
        name: getty@tty1.service
      - enabled: true
        name: tailscaled.service
      - enabled: true
        name: ucore-unsigned-autorebase.service
      - enabled: true
        name: ucore-signed-autorebase.service
    users:
      - name: core
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaF+DCJq1CyGrafKzDMtNjW02M5XJoH5MLFFSlHPjyz Max Schaefer
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINSF/XgIGlHjO79F6qvkna9yLEGslfMqLMC53/i1+obi kimbap AI sync
  hotdog:
    files: []
    groups:
      - gid: 1001
        name: kimbap
    hostname: hotdog
    image: ghcr.io/ublue-os/ucore:stable
    interface: enp1s0
    kernel_arguments: []
    linger: false
    links: []
    trees:
      - local: templates/hosts/common/etc
        path: /etc
      - local: data/hosts/hotdog/etc
        path: /etc
    units:
      - enabled: true
        name: sanoid.timer
      - enabled: true
        name: tailscaled.service
      - enabled: true
        name: ucore-unsigned-autorebase.service
      - enabled: true
        name: ucore-signed-autorebase.service
      - enabled: true
        name: zfs-scrub-monthly@hotdog.timer
    users:
      - name: core
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaF+DCJq1CyGrafKzDMtNjW02M5XJoH5MLFFSlHPjyz Max Schaefer
      - home_dir: /var/home/kimbap
        name: kimbap
        primary_group: kimbap
        shell: /bin/bash
        ssh_authorized_keys:
          - ssh-rsa  root@truenas
        uid: 1001
  mercury:
    files: []
    groups: []
    hostname: mercury
    image: ghcr.io/ublue-os/ucore:stable
    interface: null
    kernel_arguments: []
    linger: false
    links: []
    trees:
      - local: templates/hosts/common/etc
        path: /etc
    units:
      - enabled: true
        name: tailscaled.service
      - enabled: true
        name: ucore-unsigned-autorebase.service
      - enabled: true
        name: ucore-signed-autorebase.service
    users:
      - name: core
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIaF+DCJq1CyGrafKzDMtNjW02M5XJoH5MLFFSlHPjyz Max Schaefer
