name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: validate-${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.3
      - name: Initialise providers
        run: mise run init-ci
      - name: Run hooks
        run: mise run check

  monitoring:
    name: Refresh external monitoring
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Load workflow credential
        id: credential
        uses: 1password/load-secrets-action@v5
        with:
          export-env: false
        env:
          GH_WORKFLOW_TOKEN: op://Homelab/GitHub Actions/workflow-token
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      - name: Deploy the validated inventory
        env:
          GH_TOKEN: ${{ steps.credential.outputs.GH_WORKFLOW_TOKEN }}
          HOMELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --repo maxexcloo/homelab-fly --ref main \
            --field deployment=gatus-fly --field homelab_revision="$HOMELAB_REVISION"
