name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: validate-${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.8.8
      - name: Initialise providers
        run: mise run init
      - name: Run hooks
        run: mise run prek
