name: Validate

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: validate-${{ github.workflow }}-${{ github.ref }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@v5
        with:
          version: 2026.10.4
      - name: Initialise providers
        run: mise run init-ci
      - name: Run hooks
        run: mise run check

  monitoring:
    name: Refresh external monitoring
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the validated inventory
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_FLY_DEPLOY_TOKEN }}
          HOMELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --repo maxexcloo/flylab --ref main \
            --field deployment=gatus-fly --field homelab_revision="$HOMELAB_REVISION"
