name: Check

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}

jobs:
  check:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint aqua:coreos/butane gh hk node opentofu oxfmt shellcheck updatecli
      - name: Initialise Providers
        run: mise run init:check
      - name: Run Checks
        run: mise run check

      - name: Refresh External Monitoring
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_FLY_DEPLOY_TOKEN }}
          HOMELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --field deployment=excloo-gatus \
            --field homelab_revision="$HOMELAB_REVISION" --ref main --repo maxexcloo/flylab
