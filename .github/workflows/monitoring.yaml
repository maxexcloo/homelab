name: Refresh External Monitoring
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: monitoring-${{ github.ref }}
jobs:
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - name: Refresh External Monitoring
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_FLY_DEPLOY_TOKEN }}
          HOMELAB_REVISION: ${{ github.sha }}
        run: |
          gh workflow run deploy.yaml --field deployment=gatus-fly \
            --field homelab_revision="$HOMELAB_REVISION" --ref main --repo maxexcloo/flylab
